# Filter sheet flow.
# Verifies the FilterSheet (ADR 0021 BottomSheetModal + ADR 0024 brand-first
# accordion). Sheet entry, 운동 부위 chip row, global search input, sheet
# dismissal.
#
# ADR 0024 supersedes ADR 0022's three-section orthogonal layout — the
# legacy "브랜드" / "머신" section headers are gone; brands now render as
# accordion rows with their template count, and machine rows live inside
# the expanded brand body. The 운동 부위 chip cluster stays at the top as
# a cross-filter.
#
# FilterButton uses accessibilityLabel="필터" — disambiguated post-open via
# the sheet-only label "운동 부위" (the chip cluster header).
appId: com.ironspot.app
---
- launchApp
- assertVisible: '필터'
- tapOn: '필터'
- extendedWaitUntil:
    visible: '운동 부위'
    timeout: 5000
# Global search input (slice b): the sheet exposes a top-level "머신 또는
# 브랜드 검색" affordance so search matches both dimensions. The legacy
# per-section search boxes are gone.
- assertVisible: '머신 또는 브랜드 검색'
# Confirm the ADR 0022 leftovers are absent.
- assertNotVisible: '로딩 방식'
- assertNotVisible: '머신 종류'
- tapOn: '필터 닫기'
- assertNotVisible: '운동 부위'
