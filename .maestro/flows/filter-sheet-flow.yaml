# Filter sheet flow.
# Verifies the FilterSheet (ADR 0021 BottomSheetModal + ADR 0022 machine
# template dimension). Tests sheet entry, section labels, machine chip
# rendering, active strip toggle, and reset CTA.
#
# FilterButton uses accessibilityLabel="필터" — disambiguated post-open via
# the sheet-only label "운동 부위" (Task 45 renamed from "머신 종류").
# Legacy "로딩 방식" SegmentedControl was removed in ADR 0022 (chip suffix
# absorbs the loading type info).
appId: com.ironspot.app
---
- launchApp
- assertVisible: '필터'
- tapOn: '필터'
- extendedWaitUntil:
    visible: '운동 부위'
    timeout: 5000
- assertVisible: '브랜드'
- assertVisible: '머신'
- assertNotVisible: '로딩 방식'
- assertNotVisible: '머신 종류'
- tapOn: '필터 닫기'
- assertNotVisible: '운동 부위'
