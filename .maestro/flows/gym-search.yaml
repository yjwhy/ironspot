# Gym search flow.
# Auto-search fires on the first camera idle (useMapSearch.triggerInitialSearch).
# GymCard uses a Pressable with accessibilityLabel — inner text is swallowed,
# so we assert via testID (gym-card-<kebab-name>) rather than text content.
appId: com.ironspot.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'gym-card-피트니스-팩토리'
    timeout: 15000
- assertVisible:
    id: 'gym-card-피트니스-팩토리'
