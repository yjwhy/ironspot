name: npm audit

# Security K7: `pnpm audit` doesn't run anywhere in the main CI pipeline,
# so a CVE published against an installed transitive between releases
# stays invisible until the next Dependabot bump (which is itself driven
# by GitHub Advisory feeds — same data source as `pnpm audit`, but with
# a delay).
#
# This workflow runs the same advisory check on a weekly cadence so the
# delta between "vulnerable now" and "we know about it" is bounded at
# ~7 days. Production-only deps to keep the noise focused on what ships;
# dev-only CVEs (e.g. in jest, eslint plugins) are handled by Dependabot
# at its weekly grouped cadence.

on:
  schedule:
    # Monday 08:00 Pacific/Auckland ≈ Sunday 20:00 UTC. Cron is UTC.
    - cron: '0 20 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit --prod
        run: pnpm audit --audit-level=high --prod
