name: Keep Warm (Render free tier)

# Backup keep-warm for the Render free Web Service in case the primary
# UptimeRobot monitor is degraded. See docs/harness/operations.md for the
# primary mechanism and the rationale. GitHub Actions cron triggers are
# best-effort and can be skipped under platform load, so this is a backup
# only — UptimeRobot remains the source of truth.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Security L4: empty permissions block — this workflow just pings an
# unauthenticated /actuator/health endpoint. It has zero need for the
# default GITHUB_TOKEN scope (the runner still gets a token but it can
# do nothing). Closes the unused-token attack surface.
permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /actuator/health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: curl health endpoint
        run: |
          # Security L4: `--max-redirs 0` blocks open-redirect-into-SSRF
          # if the upstream ever 301s to an attacker-controlled host
          # (low risk for our static Render URL, but free defence). The
          # `-H "Host: ..."` would catch DNS hijack scenarios but Render
          # already terminates TLS for *.onrender.com so we lean on the
          # certificate validation here.
          curl --silent --show-error --fail --max-time 30 --max-redirs 0 \
            https://ironspot.onrender.com/actuator/health
