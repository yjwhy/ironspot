name: Deploy notify

# Render free Web Service auto-deploys on every push to main but doesn't
# surface deploy events to Slack. This workflow posts two messages:
#   1. ":rocket: Deploy triggered" immediately on push (always).
#   2. ":white_check_mark: succeeded" / ":x: failed" once the Render deploy
#      for this commit reaches a terminal state, by polling the Render API.
# The outcome step is skipped silently when RENDER_API_KEY is not set, so the
# workflow keeps working in repos / forks without the secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-notify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RENDER_SERVICE_ID: srv-d81cdkd0lvsc7399jdh0
  WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  COMMIT_SHA: ${{ github.sha }}
  COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual dispatch' }}
  ACTOR: ${{ github.actor }}
  REPO: ${{ github.repository }}

jobs:
  notify:
    name: Post deploy lifecycle to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Post "Deploy triggered"
        run: |
          payload=$(jq -nc \
            --arg msg "$COMMIT_MSG" \
            --arg sha "$COMMIT_SHA" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            '{text: (":rocket: Deploy triggered — `" + $repo + "` `" + $sha[:7] + "` by `" + $actor + "`\n>" + $msg + "\n<https://github.com/" + $repo + "/commit/" + $sha + "|View commit>")}')
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$WEBHOOK_URL"

      - name: Poll Render for deploy outcome
        id: poll
        if: ${{ env.RENDER_API_KEY != '' }}
        env:
          # Bash-only safety net: fail loudly on errors / unset vars / failed pipes.
          POLL_TIMEOUT_SECONDS: '900'
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"

          # Step 1: locate the deploy that corresponds to this commit. Render's
          # auto-deploy can take a few seconds to enqueue after the push event,
          # so retry up to 2 minutes before giving up.
          deploy_id=""
          for _ in $(seq 1 24); do
            deploy_id=$(curl --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "$api?limit=5" \
              | jq -r --arg sha "$COMMIT_SHA" \
                '.[] | select(.deploy.commit.id == $sha) | .deploy.id' \
              | head -n1 || true)
            if [ -n "$deploy_id" ]; then break; fi
            sleep 5
          done

          if [ -z "$deploy_id" ]; then
            echo "result=not_found" >> "$GITHUB_OUTPUT"
            echo "elapsed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Found Render deploy $deploy_id for $COMMIT_SHA"

          # Step 2: poll the deploy until it reaches a terminal state.
          start=$(date +%s)
          while true; do
            elapsed=$(( $(date +%s) - start ))
            if [ "$elapsed" -gt "$POLL_TIMEOUT_SECONDS" ]; then
              echo "result=timeout" >> "$GITHUB_OUTPUT"
              echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            status=$(curl --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "$api/$deploy_id" \
              | jq -r '.status' || true)
            case "$status" in
              live)
                echo "result=success" >> "$GITHUB_OUTPUT"
                echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed|deactivated)
                echo "result=failed" >> "$GITHUB_OUTPUT"
                echo "deploy_status=$status" >> "$GITHUB_OUTPUT"
                echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
            sleep 10
          done

      - name: Post deploy outcome to Slack
        if: ${{ env.RENDER_API_KEY != '' && steps.poll.conclusion != 'skipped' }}
        env:
          RESULT: ${{ steps.poll.outputs.result }}
          ELAPSED: ${{ steps.poll.outputs.elapsed }}
          DEPLOY_STATUS: ${{ steps.poll.outputs.deploy_status }}
          DEPLOY_ID: ${{ steps.poll.outputs.deploy_id }}
        run: |
          case "$RESULT" in
            success)
              icon=":white_check_mark:"
              verb="succeeded"
              ;;
            failed)
              icon=":x:"
              verb="failed (${DEPLOY_STATUS})"
              ;;
            timeout)
              icon=":hourglass:"
              verb="status check timed out (15m)"
              ;;
            not_found)
              icon=":grey_question:"
              verb="not matched in Render API queue"
              ;;
            *)
              icon=":question:"
              verb="unknown ($RESULT)"
              ;;
          esac
          elapsed=${ELAPSED:-0}
          mins=$(( elapsed / 60 ))
          secs=$(( elapsed % 60 ))
          payload=$(jq -nc \
            --arg icon "$icon" \
            --arg verb "$verb" \
            --arg sha "$COMMIT_SHA" \
            --arg repo "$REPO" \
            --arg mins "$mins" \
            --arg secs "$secs" \
            '{text: ($icon + " Deploy " + $verb + " — `" + $repo + "` `" + $sha[:7] + "` (" + $mins + "m " + $secs + "s)")}')
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$WEBHOOK_URL"
