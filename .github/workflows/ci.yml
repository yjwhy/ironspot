name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Security task #47: explicitly scope the default GITHUB_TOKEN to read-only
# at the workflow level. Without this the org-default applies, which is
# read-write — a compromised action could then create commits / branches /
# PRs. Jobs can opt back into write where needed (none required today).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test -- --ci
