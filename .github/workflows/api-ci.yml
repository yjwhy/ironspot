name: API CI

on:
  push:
    paths: ['iron-spot-api/**']
  pull_request:
    paths: ['iron-spot-api/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java24
        with:
          java-version: '24'
          distribution: 'temurin'
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        working-directory: iron-spot-api
        run: ./gradlew test
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}

      - name: Setup pnpm
        if: ${{ !cancelled() }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      - name: Export OpenAPI spec
        if: ${{ !cancelled() }}
        working-directory: iron-spot-api
        run: ./gradlew test --tests "com.ironspot.SpecExportTest" --rerun
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}

      - name: Regenerate API client
        if: ${{ !cancelled() }}
        run: pnpm generate:api

      - name: Check generated client is up-to-date
        if: ${{ !cancelled() }}
        run: git diff --exit-code openapi.json src/shared/generated/

      - name: Build JAR
        working-directory: iron-spot-api
        run: ./gradlew bootJar
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}
