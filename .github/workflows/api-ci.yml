name: API CI

on:
  push:
    paths: ['iron-spot-api/**']
  pull_request:
    paths: ['iron-spot-api/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java24
        with:
          java-version: '24'
          distribution: 'temurin'
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        working-directory: iron-spot-api
        run: ./gradlew test
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}
      - name: Build JAR
        working-directory: iron-spot-api
        run: ./gradlew bootJar
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}
