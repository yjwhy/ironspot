name: API CI

on:
  push:
    paths: ['iron-spot-api/**']
  pull_request:
    paths: ['iron-spot-api/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        working-directory: iron-spot-api
        run: ./gradlew test
      - name: Build JAR
        working-directory: iron-spot-api
        run: ./gradlew bootJar
