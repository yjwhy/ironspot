name: API CI

on:
  push:
    paths: ['iron-spot-api/**']
  pull_request:
    paths: ['iron-spot-api/**']

# Security task #47: workflow-scoped read-only GITHUB_TOKEN. See ci.yml for
# the same rationale.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Kotlin DSL (embedded in Gradle 8.x) cannot parse Java 25 version strings.
      # Workaround: run the Gradle daemon on Java 24 (via JAVA_HOME override below)
      # while the build toolchain still compiles sources with Java 25.
      # Track: https://youtrack.jetbrains.com/issue/KT-67005
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        id: java24
        with:
          java-version: '24'
          distribution: 'temurin'
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          # Security L3: verify gradle-wrapper.jar against gradle.org's
          # known-good SHA list. A poisoned wrapper would otherwise run
          # with full build privileges (and could exfiltrate secrets).
          validate-wrappers: true
      - name: Run tests
        working-directory: iron-spot-api
        run: ./gradlew test
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}
          # Naver 지역검색 API credentials — gates NaverSearchServiceIT (real-API contract test).
          # When unset, the IT skips via @EnabledIfEnvironmentVariable.
          NAVER_SEARCH_CLIENT_ID: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
          NAVER_SEARCH_CLIENT_SECRET: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}

      - name: Setup pnpm
        if: ${{ !cancelled() }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Setup Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      # Security L6: `--frozen-lockfile` is load-bearing. The orval regen
      # step below produces a diff against the committed client only if
      # the install matched the lockfile exactly. Dropping the flag would
      # silently start running the regen against a drifted dependency tree
      # and the "client is up-to-date" check would either false-positive
      # (mask drift) or false-negative (flag drift caused by the install
      # itself). Do not remove `--frozen-lockfile` without also revisiting
      # the regen / check pipeline below.
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      - name: Export OpenAPI spec
        if: ${{ !cancelled() }}
        working-directory: iron-spot-api
        run: ./gradlew test --tests "com.ironspot.SpecExportTest" --rerun
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}

      - name: Regenerate API client
        if: ${{ !cancelled() }}
        run: pnpm generate:api

      - name: Check generated client is up-to-date
        if: ${{ !cancelled() }}
        run: git diff --exit-code openapi.json src/shared/generated/

      - name: Build JAR
        working-directory: iron-spot-api
        run: ./gradlew bootJar
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}
