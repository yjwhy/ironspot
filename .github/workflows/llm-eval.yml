name: llm-eval

on:
  pull_request:
    paths:
      - 'iron-spot-api/src/main/resources/prompts/**'
      - 'iron-spot-api/src/main/java/com/ironspot/search/llm/**'
      - 'iron-spot-api/src/main/java/com/ironspot/search/dsl/**'
      - 'iron-spot-api/src/main/java/com/ironspot/search/SqlBuilder.java'
      - 'iron-spot-api/src/main/java/com/ironspot/search/DslValidator.java'
      - 'iron-spot-api/src/test/java/com/ironspot/search/eval/**'
      - 'iron-spot-api/src/test/resources/eval/**'
  workflow_dispatch:
    inputs:
      model:
        description: 'LLM under eval (groq supported today; gemini reserved for future toggle)'
        required: false
        default: 'groq'
        type: choice
        options:
          - groq
          - gemini

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    # Local M-series wallclock is ~3m 30s; ubuntu-latest is ~2.5x slower for the same
    # work (cold daemon, shared-tenant CPU, runner-to-Groq RTT). First PR run hit
    # exactly 10m and was killed mid-suite. 20m gives comfortable headroom while
    # still capping a runaway (e.g., Groq RATE_LIMIT cascading 60s back-offs).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Kotlin DSL embedded in Gradle 9.x cannot parse Java 25 version strings — same
      # workaround as api-ci.yml: run the Gradle daemon on Java 24 while the build
      # toolchain compiles sources with Java 25.
      - uses: actions/setup-java@v5
        id: java24
        with:
          java-version: '24'
          distribution: 'temurin'
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run EvalSuiteTest
        id: eval
        working-directory: iron-spot-api
        run: ./gradlew test --tests "com.ironspot.search.eval.EvalSuiteTest" --rerun-tasks
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}
          EVAL_RUN: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload failures.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-eval-failures
          path: iron-spot-api/build/reports/eval/failures.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Post PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          FAILURES_PATH: iron-spot-api/build/reports/eval/failures.json
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- llm-eval-comment -->';

            let body;
            try {
              const failures = JSON.parse(fs.readFileSync(process.env.FAILURES_PATH, 'utf8'));
              if (failures.length === 0) {
                body = `${marker}\n## 🚨 LLM Eval failed\n\nThe eval task failed but no per-case failures were captured. Inspect the workflow logs.`;
              } else {
                const top = failures.slice(0, 3).map(f => {
                  const expectedJson = JSON.stringify(f.expected);
                  const actualJson = JSON.stringify(f.actual);
                  return `<details><summary><code>${f.input}</code> — mismatch on \`${f.mismatchField}\`</summary>\n\n` +
                    `\`\`\`json\n// expected\n${expectedJson}\n// actual\n${actualJson}\n\`\`\`\n</details>`;
                }).join('\n\n');
                body = `${marker}\n## 🚨 LLM Eval Failures (${failures.length} / 6)\n\n${top}\n\nFull report: download the \`llm-eval-failures\` artifact from this run.`;
              }
            } catch (err) {
              body = `${marker}\n## 🚨 LLM Eval failed\n\nCould not read failures.json (${err.message}). Inspect the workflow logs.`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
