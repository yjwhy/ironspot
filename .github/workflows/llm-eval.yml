name: llm-eval

on:
  pull_request:
    paths:
      - 'iron-spot-api/src/main/resources/prompts/**'
      - 'iron-spot-api/src/main/java/com/ironspot/search/llm/**'
      - 'iron-spot-api/src/main/java/com/ironspot/search/dsl/**'
      - 'iron-spot-api/src/main/java/com/ironspot/search/SqlBuilder.java'
      - 'iron-spot-api/src/main/java/com/ironspot/search/DslValidator.java'
      - 'iron-spot-api/src/test/java/com/ironspot/search/eval/**'
      - 'iron-spot-api/src/test/resources/eval/**'
  workflow_dispatch:
    inputs:
      model:
        description: 'LLM under eval (groq supported today; gemini reserved for future toggle)'
        required: false
        default: 'groq'
        type: choice
        options:
          - groq
          - gemini

permissions:
  contents: read
  pull-requests: write

# Security L1: this workflow is split into two jobs. The `eval` job is the
# only one that needs GROQ_API_KEY + GEMINI_API_KEY in its environment.
# The `report` job runs strictly after eval (`needs: eval`) and has no
# secrets in scope — it just reads the failures.json artifact that eval
# produced and posts the PR comment + uploads the public-facing
# `llm-eval-failures` artifact. A future refactor that accidentally
# promotes step-level env to job level cannot leak the secrets into the
# artifact-upload + PR-comment paths because they live in a separate job.

jobs:
  eval:
    runs-on: ubuntu-latest
    # Local M-series wallclock is ~3m 30s; ubuntu-latest is ~2.5x slower for the same
    # work (cold daemon, shared-tenant CPU, runner-to-Groq RTT). First PR run hit
    # exactly 10m and was killed mid-suite. 20m gives comfortable headroom while
    # still capping a runaway (e.g., Groq RATE_LIMIT cascading 60s back-offs).
    timeout-minutes: 20
    # Job-scoped outputs: `report` needs to know whether `eval` failed so it can
    # decide whether to post the PR comment. We can't rely on `needs.eval.result`
    # alone because we use `if: always()` on the report job to handle the
    # post-failure path.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Kotlin DSL embedded in Gradle 9.x cannot parse Java 25 version strings — same
      # workaround as api-ci.yml: run the Gradle daemon on Java 24 while the build
      # toolchain compiles sources with Java 25.
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        id: java24
        with:
          java-version: '24'
          distribution: 'temurin'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6
        with:
          # Security L3: verify gradle-wrapper.jar against gradle.org's
          # known-good SHA list before running tests with secrets in the
          # job env.
          validate-wrappers: true

      - name: Run EvalSuiteTest
        id: eval
        working-directory: iron-spot-api
        run: ./gradlew test --tests "com.ironspot.search.eval.EvalSuiteTest" --rerun-tasks
        env:
          JAVA_HOME: ${{ steps.java24.outputs.path }}
          EVAL_RUN: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Handoff artifact for the `report` job. Always uploads (even on test
      # failure) so the report job has something to render.
      - name: Upload failures.json (handoff to report job)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-eval-failures
          path: iron-spot-api/build/reports/eval/failures.json
          retention-days: 90
          if-no-files-found: ignore

  report:
    # No secrets injected here. The artifact + PR comment surface lives in
    # this isolated job so a future refactor cannot accidentally leak GROQ
    # or GEMINI keys into the public-facing artifact path.
    runs-on: ubuntu-latest
    needs: eval
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download failures.json from eval job
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: llm-eval-failures
          path: artifact
        continue-on-error: true

      - name: Post PR comment on failure
        if: needs.eval.result == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          FAILURES_PATH: artifact/failures.json
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- llm-eval-comment -->';

            let body;
            try {
              const failures = JSON.parse(fs.readFileSync(process.env.FAILURES_PATH, 'utf8'));
              if (failures.length === 0) {
                body = `${marker}\n## 🚨 LLM Eval failed\n\nThe eval task failed but no per-case failures were captured. Inspect the workflow logs.`;
              } else {
                const top = failures.slice(0, 3).map(f => {
                  const expectedJson = JSON.stringify(f.expected);
                  const actualJson = JSON.stringify(f.actual);
                  return `<details><summary><code>${f.input}</code> — mismatch on \`${f.mismatchField}\`</summary>\n\n` +
                    `\`\`\`json\n// expected\n${expectedJson}\n// actual\n${actualJson}\n\`\`\`\n</details>`;
                }).join('\n\n');
                body = `${marker}\n## 🚨 LLM Eval Failures (${failures.length} / 6)\n\n${top}\n\nFull report: download the \`llm-eval-failures\` artifact from this run.`;
              }
            } catch (err) {
              body = `${marker}\n## 🚨 LLM Eval failed\n\nCould not read failures.json (${err.message}). Inspect the workflow logs.`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
