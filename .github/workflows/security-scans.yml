name: Security scans

# Security task #50: SAST + secret scan + dependency review gate on every
# PR. CodeQL covers Java + JavaScript / TypeScript, gitleaks covers
# committed secrets, and dependency-review-action blocks vulnerable deps
# from being merged.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full scan on main so a CVE published after a green merge is
    # still surfaced. UTC because GitHub cron does not accept Asia/Seoul.
    - cron: '17 3 * * 1'

# Workflow-level read-only token; jobs that need more (CodeQL needs
# security-events write) opt back in.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      - name: Analyze
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: '/language:${{ matrix.language }}'

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    # GitHub action-only, no language matrix; uses the dependency graph
    # already populated by Dependabot. Blocks merges that introduce
    # known-vulnerable transitive deps.
    if: github.event_name == 'pull_request'
    name: dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb1541a4984c76d921601d7c # v4
        with:
          # Security K2: moderate-severity CVEs were merging silently
          # because the previous gate only fired at `high`. `moderate`
          # is a usability tradeoff (slightly noisier PRs) for a
          # meaningful coverage gap (most published Spring Security
          # CVEs land at moderate). `comment-summary-in-pr` makes the
          # failure actionable: reviewer sees which dep + advisory
          # without digging into the action log.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
