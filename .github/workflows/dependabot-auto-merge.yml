name: Dependabot auto-merge

# Security task #48: enforce the "auto-merge patch/minor + github-actions"
# policy from CLAUDE.md so backlog patches do not wait for human attention.
# Major bumps still require explicit approval (Dependabot only marks them
# `version-update:semver-major`).

on: pull_request_target

permissions:
  # The default GITHUB_TOKEN inside pull_request_target gets the org-default
  # privileges. Scope down to the two writes we actually need.
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Security K1: this workflow runs in `pull_request_target` context,
    # so the GITHUB_TOKEN holds the base repo's write privileges AND a
    # future `actions/checkout` step could be tricked into pulling an
    # attacker's PR HEAD into a privileged runner (the "pwn-request"
    # pattern). Do NOT add `actions/checkout` here. Every step below
    # must be a GitHub API call that operates on the PR by number only,
    # never on its tree contents. If a future maintainer needs to read
    # PR file changes, do it via `gh pr view <pr#> --json files` against
    # the base ref — never via a workspace checkout.
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve + enable squash auto-merge for safe bumps
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.package-ecosystem == 'github-actions'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
