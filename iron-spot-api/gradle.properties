# Kotlin DSL embedded compiler cannot parse Java 25 version strings (Gradle 8.14.4).
# Set org.gradle.java.home to a Java 24 JDK in your local ~/.gradle/gradle.properties
# so the Gradle daemon runs on Java 24 while the toolchain compiles with Java 25.
#
# Example (~/.gradle/gradle.properties):
#   org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-24.jdk/Contents/Home
