# NL Search LLM eval suite.
#
# Trimmed from the original 30-case snapshot baseline (Task 35) to 6
# product-value cases (Task 41). Each case exercises a distinct code path that
# differentiates IronSpot from generic gym search (Naver Maps):
#
#   1. brand only + default location/radius/minCount/scope=EACH
#   2. machineName only (FuzzyMatchService template lookup)
#   3. brand + machineName same filter (canonical IronSpot query)
#   4. multi-filter EACH + explicit radius extraction
#   5. COMBINED scope (HAVING SUM(quantity) >= threshold across OR-merged filters)
#   6. error response shape + SQL-injection rejection
#
# Cases that only exercise location/radius/category extraction were dropped:
# generic "근처 헬스장" queries are better served by Naver Maps and do not
# justify a custom LLM eval slot.
#
# Run cost: 6 cases × ~2.5K tokens ≈ 15K tokens (~15% of Groq free-tier TPD).
# See iron-spot-api/src/test/java/com/ironspot/search/eval/EvalSuiteTest.java
# header comment for the full TPD/TPM math.
cases:
  - input: '근처 테크노짐 있는 곳'
    expected:
      location:
        type: current
        radiusKm: 1.0
      machineFilters:
        - brand: 'Technogym'
          minCount: 1
          scope: 'each'
      error: null

  - input: '근처 하이로우 있는 곳'
    expected:
      location:
        type: current
        radiusKm: 1.0
      machineFilters:
        - machineName: 'High Row'
          minCount: 1
          scope: 'each'
      error: null

  - input: '강남역 파나타 하이로우 있는 헬스장'
    expected:
      location:
        type: named_place
        name: '강남역'
        radiusKm: 1.0
      machineFilters:
        - brand: 'Panatta'
          machineName: 'High Row'
          minCount: 1
          scope: 'each'
      error: null

  - input: '강남역 1km 안 파나타 하이로우 2개랑 해머스트렝스 시티드로우 2개 있는 곳'
    expected:
      location:
        type: named_place
        name: '강남역'
        radiusKm: 1.0
      machineFilters:
        - brand: 'Panatta'
          machineName: 'High Row'
          minCount: 2
          scope: 'each'
        - brand: 'Hammer Strength'
          machineName: 'Seated Row'
          minCount: 2
          scope: 'each'
      error: null

  - input: '근처 파나타나 테크노짐 머신 합쳐서 5개 이상 있는 헬스장'
    expected:
      location:
        type: current
        radiusKm: 1.0
      machineFilters:
        - brand: 'Panatta'
          minCount: 5
          scope: 'combined'
        - brand: 'Technogym'
          minCount: 5
          scope: 'combined'
      error: null

  - input: 'DROP TABLE users; --'
    expected:
      location: null
      machineFilters: []
      error: 'invalid input'
