<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IronSpot Ops Dashboard</title>
    <style>
      :root {
        --bg: #fffbeb;
        --fg: #1f2937;
        --muted: #6b7280;
        --accent: #f59e0b;
        --border: #e5e7eb;
        --danger: #dc2626;
        --success: #16a34a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        max-width: 1100px;
        margin: 0 auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 2px solid var(--accent);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      select,
      button {
        padding: 6px 12px;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: white;
        cursor: pointer;
      }
      button:hover {
        background: #f3f4f6;
      }
      section {
        margin-bottom: 32px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 16px;
      }
      section h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
      }
      th {
        font-weight: 600;
        color: var(--muted);
      }
      .right {
        text-align: right;
      }
      .muted {
        color: var(--muted);
      }
      .bar {
        background: var(--accent);
        height: 10px;
        border-radius: 2px;
      }
      .danger {
        color: var(--danger);
      }
      .empty {
        padding: 12px;
        color: var(--muted);
        text-align: center;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .summary {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .summary div {
        flex: 1;
        min-width: 140px;
      }
      .summary .num {
        font-size: 1.4rem;
        font-weight: 700;
      }
      .summary .lbl {
        font-size: 0.8rem;
        color: var(--muted);
        text-transform: uppercase;
      }
      footer {
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>IronSpot Ops Dashboard</h1>
      <div class="controls">
        <label for="period" class="muted">기간:</label>
        <select id="period">
          <option value="7d">7일</option>
          <option value="30d" selected>30일</option>
          <option value="all">전체</option>
        </select>
        <button id="refresh">새로고침</button>
      </div>
    </header>

    <section id="nl-search-section">
      <h2>NL Search</h2>
      <div class="summary">
        <div><div class="lbl">총 쿼리</div><div class="num" id="nl-total">-</div></div>
        <div><div class="lbl">고유 normalised</div><div class="num" id="nl-distinct">-</div></div>
        <div><div class="lbl">고유 사용자</div><div class="num" id="nl-users">-</div></div>
      </div>
      <h3 style="font-size: 0.95rem; margin: 16px 0 8px">상위 쿼리</h3>
      <table>
        <thead>
          <tr>
            <th>Normalised</th>
            <th class="right">hits</th>
            <th class="right">users</th>
          </tr>
        </thead>
        <tbody id="nl-top"></tbody>
      </table>
    </section>

    <section id="moderation-section">
      <h2>Moderation</h2>
      <div class="summary">
        <div><div class="lbl">총 disposition</div><div class="num" id="mod-total">-</div></div>
        <div><div class="lbl">Ban 이벤트</div><div class="num" id="mod-bans">-</div></div>
      </div>
      <div class="grid">
        <div>
          <h3 style="font-size: 0.95rem; margin: 0 0 8px">업로더 actioned 분포</h3>
          <p class="muted" style="font-size: 0.8rem; margin: 0 0 8px">
            3건+ 누적 시 auto-ban 위험
          </p>
          <table>
            <tbody id="mod-uploader-hist"></tbody>
          </table>
        </div>
        <div>
          <h3 style="font-size: 0.95rem; margin: 0 0 8px">리포터 dismissed 분포</h3>
          <p class="muted" style="font-size: 0.8rem; margin: 0 0 8px">
            5건+ 누적 시 auto-ban 위험
          </p>
          <table>
            <tbody id="mod-reporter-hist"></tbody>
          </table>
        </div>
      </div>
      <h3 style="font-size: 0.95rem; margin: 16px 0 8px">상위 리포터</h3>
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th class="right">actioned</th>
            <th class="right">dismissed</th>
            <th class="right">정확도</th>
          </tr>
        </thead>
        <tbody id="mod-top-reporters"></tbody>
      </table>
    </section>

    <section id="ban-section">
      <h2>Ban 이벤트</h2>
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>Role</th>
            <th>Banned at</th>
          </tr>
        </thead>
        <tbody id="ban-events"></tbody>
      </table>
    </section>

    <footer>
      <span id="status" class="muted">loading...</span>
    </footer>

    <script>
      const $ = (id) => document.getElementById(id);

      function escapeHtml(value) {
        if (value === null || value === undefined) return "";
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderRows(tbody, rows, columns, emptyMessage) {
        if (!rows || rows.length === 0) {
          tbody.innerHTML =
            '<tr><td class="empty" colspan="' + columns + '">' + emptyMessage + "</td></tr>";
          return;
        }
        tbody.innerHTML = rows.join("");
      }

      function formatUserId(uuid) {
        if (!uuid) return "—";
        return "<code>" + uuid.substring(0, 8) + "</code>";
      }

      function formatPercent(value) {
        if (typeof value !== "number") return "—";
        return Math.round(value * 100) + "%";
      }

      function maxHist(histogram) {
        return histogram.reduce((max, b) => Math.max(max, b.userCount), 0) || 1;
      }

      function renderHistogram(tbody, histogram) {
        const max = maxHist(histogram);
        const rows = histogram.map((bucket) => {
          const width = Math.round((bucket.userCount / max) * 100);
          return (
            "<tr><td>" +
            escapeHtml(bucket.bucket) +
            "</td><td class='right'>" +
            bucket.userCount +
            "</td><td><div class='bar' style='width:" +
            width +
            "%'></div></td></tr>"
          );
        });
        renderRows(tbody, rows, 3, "데이터 없음");
      }

      function renderNlSearch(data) {
        $("nl-total").textContent = data.totalQueries;
        $("nl-distinct").textContent = data.distinctNormalised;
        $("nl-users").textContent = data.distinctUsers;
        const rows = (data.topQueries || []).map(
          (q) =>
            "<tr><td>" +
            escapeHtml(q.normalised) +
            "</td><td class='right'>" +
            q.count +
            "</td><td class='right'>" +
            q.distinctUserCount +
            "</td></tr>",
        );
        renderRows($("nl-top"), rows, 3, "기간 내 NL 검색 없음");
      }

      function renderModeration(data) {
        $("mod-total").textContent = data.totalDispositions;
        $("mod-bans").textContent = (data.banEvents || []).length;
        renderHistogram($("mod-uploader-hist"), data.uploaderActionedHistogram || []);
        renderHistogram($("mod-reporter-hist"), data.reporterDismissedHistogram || []);
        const rows = (data.topReporters || []).map(
          (r) =>
            "<tr><td>" +
            formatUserId(r.userId) +
            "</td><td class='right'>" +
            r.actionedCount +
            "</td><td class='right'>" +
            r.dismissedCount +
            "</td><td class='right'>" +
            formatPercent(r.accuracy) +
            "</td></tr>",
        );
        renderRows($("mod-top-reporters"), rows, 4, "기간 내 활동 리포터 없음");
      }

      function renderBanEvents(data) {
        const rows = (data.banEvents || []).map(
          (e) =>
            "<tr><td>" +
            formatUserId(e.userId) +
            "</td><td>" +
            escapeHtml(e.role) +
            "</td><td>" +
            escapeHtml(e.bannedAt) +
            "</td></tr>",
        );
        renderRows($("ban-events"), rows, 3, "기간 내 ban 이벤트 없음");
      }

      async function load() {
        const period = $("period").value;
        $("status").textContent = "loading…";
        try {
          const res = await fetch("/admin/dashboard/data?period=" + period, {
            credentials: "same-origin",
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const json = await res.json();
          renderNlSearch(json.nlSearch);
          renderModeration(json.moderation);
          renderBanEvents(json.moderation);
          $("status").textContent =
            "마지막 갱신 " + new Date().toLocaleTimeString("ko-KR") + " · period=" + period;
        } catch (err) {
          $("status").innerHTML =
            "<span class='danger'>로딩 실패: " + escapeHtml(err.message) + "</span>";
        }
      }

      $("period").addEventListener("change", load);
      $("refresh").addEventListener("click", load);
      load();
    </script>
  </body>
</html>
