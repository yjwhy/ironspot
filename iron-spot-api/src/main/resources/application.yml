spring:
  application:
    name: iron-spot-api
  main:
    web-application-type: servlet
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  cache:
    # Caffeine in-memory cache used for Naver 지역검색 results (F7 NL search
    # Naver merge). 60s TTL plus 500 entry cap protects the 25K/day Naver
    # free-tier quota from being burned by repeated identical search bar
    # queries while still picking up new places within a minute.
    type: caffeine
    cache-names: naverPlaces
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s
  flyway:
    # Task 47 / ADR 0023 — DB schema migrations via Flyway Community.
    # Prod has been running with manual SQL migrations since Phase 1; baseline-on-migrate
    # tells Flyway to record the current schema state as a baseline (V1) and only apply
    # later versions on top. baseline-version=1 means "V1__baseline.sql is the baseline
    # snapshot; never execute it on an already-populated DB". New migrations land as
    # V2+. Tests run with init-test-db.sql via Testcontainers — Flyway is disabled in the
    # test profile so the two schema-init paths don't fight.
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true

security:
  # Supabase JWKS endpoint — JwtValidator fetches the public keys from here and
  # caches them in-process. The legacy SUPABASE_JWT_SECRET (HS256 shared secret)
  # is no longer used because Supabase auto-migrated all projects to ECC P-256.
  supabase-jwks-url: ${SUPABASE_JWKS_URL}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

google:
  vision:
    api-key: ${GOOGLE_VISION_API_KEY:}
    # BE Vision call timeout must stay strictly less than the FE upload
    # mutation timeout (api-client.ts: 30s) so a slow Vision response
    # never leaves the FE timing out before the BE can respond.
    #
    # Vision normally returns in 1-3s on a warm WebClient connection pool.
    # The very first Vision call after a Render cold-boot is significantly
    # slower (~7-15s) because Netty has to load native libs, establish a
    # fresh TLS connection to vision.googleapis.com, and warm the reactor
    # event loop. The 7s default tripped on photo da0fd491 on 2026-05-23
    # for exactly this reason (TimeoutException at OcrService:76 with a
    # warm BE but a cold WebClient pool).
    #
    # 20s gives the cold-pool first request enough headroom while leaving
    # 10s of slack before the FE ky timeout fires. Subsequent calls reuse
    # the warm pool and finish in 1-3s — the long timeout never trips on
    # the happy path.
    timeout-seconds: ${VISION_TIMEOUT_SECONDS:20}

# Phase 5 cost safety net (Layer B): per-user Vision-spending upload quota.
# Layered with GCP-side quotas (30 req/min per feature) + budget alert ($5)
# so a single compromised account cannot drain the free tier on its own.
# Each photo upload spends 3 Vision units (TEXT_DETECTION + SAFE_SEARCH +
# FACE_DETECTION). Free tier = 1000 units/month = ~333 photos/month total.
# Per-user 30/day × DAU 50 = 1500/month theoretical max — exceeds free tier
# but most users will not hit the daily cap. Tune via env vars without a
# redeploy.
vision:
  quota:
    hourly: ${VISION_QUOTA_HOURLY:15}
    daily: ${VISION_QUOTA_DAILY:30}
    monthly: ${VISION_QUOTA_MONTHLY:200}

# 국세청 사업자등록정보 진위확인 및 상태조회 서비스 (Task 47 / ADR 0023 Q1 U).
# Public data portal API (공공데이터포털): https://www.data.go.kr/data/15081808/openapi.do
# Free tier — no per-call billing. Service key issued via portal signup + service
# request (1-2 day approval). Empty key → BusinessRegistryClient.validate falls
# through to "no verification available" and the verifier returns Disputed →
# admin manual review. This degrades gracefully so dev / pre-key environments
# don't crash on owner claim flow.
nts:
  business:
    base-url: https://api.odcloud.kr
    api-key: ${NTS_BUSINESS_API_KEY:}

naver:
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET}

groq:
  # Empty → GroqLlamaClient logs warning at startup, throws TRANSPORT at runtime.
  api-key: ${GROQ_API_KEY:}

gemini:
  # Empty → GeminiFlashClient logs warning at startup, throws TRANSPORT at runtime.
  api-key: ${GEMINI_API_KEY:}

ironspot:
  slack:
    admin-webhook-url: ${SLACK_ADMIN_WEBHOOK_URL:}
    smoke:
      # Gate for /api/_admin/slack-smoke/{path} ops verification endpoint.
      # MUST remain false outside the post-deploy smoke window — toggle on, run 3 curls, toggle off.
      enabled: ${IRONSPOT_SLACK_SMOKE_ENABLED:false}
  sentry:
    smoke:
      # Gate for /api/_admin/sentry-smoke ops verification endpoint (Task 32 decision #3).
      # Endpoint throws a RuntimeException that GlobalExceptionHandler routes through
      # Sentry.captureException. MUST remain false outside the Task 32b verify window.
      enabled: ${IRONSPOT_SENTRY_SMOKE_ENABLED:false}

sentry:
  # Empty DSN → SentryConfig skips Sentry.init entirely (fail-open, zero traffic in dev/test).
  dsn: ${SENTRY_DSN:}
  environment: development
  traces-sample-rate: 0.5

server:
  # Bind to PORT env var when present (Render injects PORT=10000 by default and
  # routes health checks + traffic to that exact port). Fall back to 8080 for
  # local dev via `pnpm dlx ... bootRun` and docker-compose.
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    version: '@project.version@'
