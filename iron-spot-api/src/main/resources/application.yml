spring:
  application:
    name: iron-spot-api
  main:
    web-application-type: servlet
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  flyway:
    # Task 47 / ADR 0023 — DB schema migrations via Flyway Community.
    # Prod has been running with manual SQL migrations since Phase 1; baseline-on-migrate
    # tells Flyway to record the current schema state as a baseline (V1) and only apply
    # later versions on top. baseline-version=1 means "V1__baseline.sql is the baseline
    # snapshot; never execute it on an already-populated DB". New migrations land as
    # V2+. Tests run with init-test-db.sql via Testcontainers — Flyway is disabled in the
    # test profile so the two schema-init paths don't fight.
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true

security:
  # Supabase JWKS endpoint — JwtValidator fetches the public keys from here and
  # caches them in-process. The legacy SUPABASE_JWT_SECRET (HS256 shared secret)
  # is no longer used because Supabase auto-migrated all projects to ECC P-256.
  supabase-jwks-url: ${SUPABASE_JWKS_URL}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

google:
  vision:
    api-key: ${GOOGLE_VISION_API_KEY:}

# 국세청 사업자등록정보 진위확인 및 상태조회 서비스 (Task 47 / ADR 0023 Q1 U).
# Public data portal API (공공데이터포털): https://www.data.go.kr/data/15081808/openapi.do
# Free tier — no per-call billing. Service key issued via portal signup + service
# request (1-2 day approval). Empty key → BusinessRegistryClient.validate falls
# through to "no verification available" and the verifier returns Disputed →
# admin manual review. This degrades gracefully so dev / pre-key environments
# don't crash on owner claim flow.
nts:
  business:
    base-url: https://api.odcloud.kr
    api-key: ${NTS_BUSINESS_API_KEY:}

naver:
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET}

groq:
  # Empty → GroqLlamaClient logs warning at startup, throws TRANSPORT at runtime.
  api-key: ${GROQ_API_KEY:}

gemini:
  # Empty → GeminiFlashClient logs warning at startup, throws TRANSPORT at runtime.
  api-key: ${GEMINI_API_KEY:}

ironspot:
  slack:
    admin-webhook-url: ${SLACK_ADMIN_WEBHOOK_URL:}
    smoke:
      # Gate for /api/_admin/slack-smoke/{path} ops verification endpoint.
      # MUST remain false outside the post-deploy smoke window — toggle on, run 3 curls, toggle off.
      enabled: ${IRONSPOT_SLACK_SMOKE_ENABLED:false}
  sentry:
    smoke:
      # Gate for /api/_admin/sentry-smoke ops verification endpoint (Task 32 decision #3).
      # Endpoint throws a RuntimeException that GlobalExceptionHandler routes through
      # Sentry.captureException. MUST remain false outside the Task 32b verify window.
      enabled: ${IRONSPOT_SENTRY_SMOKE_ENABLED:false}

sentry:
  # Empty DSN → SentryConfig skips Sentry.init entirely (fail-open, zero traffic in dev/test).
  dsn: ${SENTRY_DSN:}
  environment: development
  traces-sample-rate: 0.5

server:
  # Bind to PORT env var when present (Render injects PORT=10000 by default and
  # routes health checks + traffic to that exact port). Fall back to 8080 for
  # local dev via `pnpm dlx ... bootRun` and docker-compose.
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    version: '@project.version@'
